<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ClipCut</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="ClipCut">
<meta name="theme-color" content="#10b981">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
<style>
  /* editor แบบย่อสำหรับมือถือ — ดูคลิป · ลบ/เปลี่ยน GIF · ลบภาพ · แก้คำซับ · เรนเดอร์ · บันทึกลงเครื่อง
     งานละเอียด (ลากตำแหน่ง/ตั้งเวลา/ซูม) ไปทำในคอม */
  html, body { overflow: auto; height: auto; font-size: 15px; }
  .top { position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top); height: auto; min-height: 52px; }
  .top .ttl { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(110px + env(safe-area-inset-bottom)); }
  .vbox { background: #000; border-radius: 14px; overflow: hidden; position: relative; }
  .vbox video { width: 100%; max-height: 62vh; display: block; margin: auto; background: #000; }
  .vbox iframe { width: 100%; height: min(68vh, 760px); border: 0; display: block; background: #000; }
  .seg2 { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg2 button { flex: 1; padding: 9px 0; border-radius: 10px; font-size: 13.5px; }
  .seg2 button.on { background: var(--accent); color: #031a12; border-color: var(--accent); font-weight: 700; }
  .vlabel { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; display: flex; gap: 8px; align-items: center; }
  .vlabel .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .vlabel .dot.ok { background: var(--accent); }
  h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 22px 2px 8px; display: flex; gap: 8px; }
  h3 span { color: var(--text); }
  .row { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px; margin-bottom: 8px; }
  .row .th { width: 64px; height: 48px; border-radius: 8px; background: #000; object-fit: contain; flex: 0 0 64px; }
  .row .info { flex: 1; min-width: 0; }
  .row .info b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .info small { color: var(--muted); }
  .row button { padding: 8px 11px; border-radius: 9px; font-size: 13px; }
  .row .del { color: #ff8a8a; }
  .sub { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .sub span { flex: 0 0 44px; color: var(--muted); font-size: 12px; padding-top: 10px; font-variant-numeric: tabular-nums; }
  .sub textarea { flex: 1; min-height: 40px; font-size: 15px; padding: 8px 10px; border-radius: 10px; resize: none; }
  .sub.dirty textarea { border-color: var(--accent); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .bar button { flex: 1; padding: 13px 0; border-radius: 12px; font-size: 15px; }
  .prog { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 6; background: var(--panel2);
    border-top: 1px solid var(--line); padding: 8px 16px; font-size: 12.5px; color: var(--muted); display: none; }
  .prog.on { display: block; }
  .prog i { display: block; height: 4px; border-radius: 3px; background: var(--accent); margin-top: 6px; width: 0; transition: width .4s; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .dl { display: flex; gap: 8px; margin-top: 10px; }
  .dl button, .dl a { flex: 1; padding: 11px 0; border-radius: 11px; font-size: 14px; text-align: center; text-decoration: none; }
  .dl a { background: var(--panel); border: 1px solid var(--line); color: var(--text); }
  .row.sel { border-color: var(--accent); }
  .more { width: 100%; padding: 10px; border-radius: 10px; margin-top: 4px; }
  /* สไตล์ซับ: ฟอนต์เลื่อนแนวนอน + ขนาด/ขอบ/ตำแหน่ง */
  .fonts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .fonts button { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 12px; border-radius: 12px; text-align: left; }
  .fonts b { font-size: 21px; line-height: 1.5; } .fonts span { font-size: 11px; color: var(--muted); }
  .fonts button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .srow { display: grid; grid-template-columns: 64px 1fr 40px; gap: 10px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .srow input { width: 100%; accent-color: var(--accent); } .srow output { text-align: right; font-variant-numeric: tabular-nums; }
  .pchips { display: flex; gap: 6px; margin-top: 10px; } .pchips button { flex: 1; padding: 8px 0; border-radius: 10px; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <a href="/" class="ib" title="หน้าแรก"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg></a>
  <div class="ttl" id="ttl">ClipCut</div>
  <span class="status" id="st"></span>
  <button class="ib" id="bBell" title="แจ้งเตือนเมื่อเรนเดอร์/ตัดเสร็จ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
</header>
<main class="wrap">
  <div class="seg2"><button id="mLive" class="on">พรีวิวสด (มีเอฟเฟกต์)</button><button id="mFile">ไฟล์ที่เรนเดอร์</button></div>
  <div class="vbox"><iframe id="live" title="พรีวิวสด"></iframe><video id="v" controls playsinline preload="metadata" style="display:none"></video></div>
  <div class="vlabel"><span class="dot" id="vdot"></span><span id="vlab"></span></div>
  <div class="dl" id="dl"><button class="primary" id="bSave">บันทึกลงรูปภาพ</button><a id="aDl" download>โหลดเป็นไฟล์</a></div>

  <h3>คลิปที่เรนเดอร์แล้ว <span id="nOut"></span></h3><div id="outs"></div>

  <h3>สไตล์ซับ — ทั้งคลิป</h3><div id="style"></div>
  <h3>GIF / meme <span id="nGif"></span></h3><div id="gifs"></div>
  <h3>ภาพพิกเซล <span id="nPix"></span></h3><div id="pix"></div>
  <h3>ซับ <span id="nSub"></span> — แตะแก้คำได้</h3><div id="subs"></div>
</main>
<div class="prog" id="prog"><span id="plog">กำลังเรนเดอร์…</span><i id="pbar"></i></div>
<div class="bar">
  <button id="bTest" title="ครึ่งความละเอียด เร็ว">เรนเดอร์ทดสอบ</button>
  <button class="primary" id="bRender">เรนเดอร์จริง</button>
</div>
<div class="toast" id="toast"></div>
<script>window.CC_PILL_TOP = true;</script>
<script src="/jobpill.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const post = (u, b) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then((r) => r.json());
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2400); }
let editT = 0, E = null, rev = 0, name = "", proxy = null, GIFS = { lib: {}, cats: {} }, outs = [], allOuts = [], pick = null, subsShown = 40;
const vurl = (p, dl) => "/api/video?path=" + encodeURIComponent(p) + (dl ? "&dl=1" : "");
const base = (p) => p.split(/[\\/]/).pop();
const kind = (p) => { const m = base(p).match(/_(edit|preview|explainer)[^_]*_(\d+x\d+)/) || [];
  return ({ edit: "เรนเดอร์จริง", preview: "ทดสอบ", explainer: "Explainer" }[m[1]] || "คลิป") + (m[2] ? " · " + m[2].replace("x", ":") : ""); };

async function load() {
  const r = await fetch("/api/edit");
  if (!r.ok) { location.href = "/"; return; }
  const j = await r.json();
  E = j.edit; rev = j.rev; name = j.name; proxy = j.proxy;
  if (!Object.keys(GIFS.lib).length) GIFS = await fetch("/api/gifs").then((x) => x.json()).catch(() => GIFS);
  const h = await fetch("/api/home").then((x) => x.json());
  const p = h.projects.find((x) => h.current && x.edit.toLowerCase() === h.current.toLowerCase());
  const want = E.mode === "explainer" ? /_explainer_/ : /_(edit|preview)_\d+x\d+\.mp4$/;
  allOuts = p ? p.outputs.map((o, i) => ({ path: o, t: p.out_mtimes[i] })) : [];
  outs = allOuts.filter((o) => want.test(o.path));
  editT = p ? p.mtime : 0;
  paint();
}
function paint() {
  $("#ttl").textContent = E.title || name.replace(".edit.json", "");
  // คลิปที่เรนเดอร์ล่าสุด (มีเอฟเฟกต์ครบ) · ยังไม่เคยเรนเดอร์ = คลิปดิบที่ตัดแล้ว
  const o = allOuts.find((x) => x.path === pick) || outs[outs.length - 1], out = o && o.path, stale = o && o.t < editT - 2, v = $("#v");
  const src = out ? vurl(out) : "/media/" + encodeURIComponent(proxy || E.video);
  if (v.dataset.src !== src) { v.dataset.src = src; v.src = src; saved = null; $("#bSave").textContent = "บันทึกลงรูปภาพ"; }
  $("#vdot").classList.toggle("ok", !!out);
  $("#vlab").textContent = out ? (pick ? kind(out) : stale ? "เรนเดอร์ก่อนแก้ครั้งล่าสุด (กดเรนเดอร์ใหม่)" : "คลิปที่เรนเดอร์ล่าสุด")
    : "ยังไม่ได้เรนเดอร์ — นี่คือคลิปที่ตัดแล้ว (ยังไม่มีเอฟเฟกต์)";
  $("#dl").style.display = out ? "" : "none";
  if (out) { $("#aDl").href = vurl(out, 1); cur = out; }
  $("#nOut").textContent = allOuts.length;
  $("#outs").innerHTML = [...allOuts].reverse().map((x) => `<div class="row${x.path === out ? " sel" : ""}"><div class="info"><b>${esc(kind(x.path))}</b><small>${new Date(x.t * 1000).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" })}</small></div>
      <button data-play="${esc(x.path)}">ดู</button><a href="${vurl(x.path, 1)}" download style="padding:8px 11px;border-radius:9px;font-size:13px;border:1px solid var(--line);color:var(--text);text-decoration:none;white-space:nowrap">โหลด</a></div>`).join("") || '<div class="empty">ยังไม่มี</div>';
  const gifs = E.items.filter((x) => x.track === "gif").sort((a, b) => a.start - b.start);
  $("#nGif").textContent = gifs.length;
  $("#gifs").innerHTML = gifs.map((it) => { const g = GIFS.lib[it.gif];
    return `<div class="row">${g ? `<video class="th" src="/gif/${g.file}" autoplay loop muted playsinline></video>` : '<div class="th"></div>'}
      <div class="info"><b>${{ overlay: "แปะทับ", cut: "ตัดเข้าเต็มจอ", freeze: "หยุดภาพ" }[it.mode]}${it.caption ? " · " + esc(it.caption) : ""}</b><small>${fmt(it.start)} · ${esc(g ? g.desc : "")}</small></div>
      ${it.mode !== "freeze" && g ? `<button data-swap="${it.id}">เปลี่ยน</button>` : ""}<button class="del" data-del="${it.id}">ลบ</button></div>`; }).join("") || '<div class="empty">ไม่มี</div>';
  const pix = E.items.filter((x) => x.track === "broll").sort((a, b) => a.start - b.start);
  $("#nPix").textContent = pix.length;
  $("#pix").innerHTML = pix.map((it) => `<div class="row"><img class="th" src="/media/${encodeURI(it.src)}"><div class="info"><b>${esc(it.src.split("/").pop().replace(/^px_|_[0-9a-f]{10}\.png$/g, "").replace(/_/g, " "))}</b><small>${fmt(it.start)}</small></div>
      <button class="del" data-del="${it.id}">ลบ</button></div>`).join("") || '<div class="empty">ไม่มี</div>';
  const subs = E.items.filter((x) => x.track === "sub").sort((a, b) => a.start - b.start);
  $("#nSub").textContent = subs.length;
  $("#subs").innerHTML = subs.slice(0, subsShown).map((it) => `<div class="sub"><span>${fmt(it.start)}</span><textarea rows="1" data-sub="${it.id}">${esc(it.text)}</textarea></div>`).join("")
    + (subs.length > subsShown ? `<button class="more" id="more">แสดงซับอีก ${subs.length - subsShown}</button>` : "");
  const m = $("#more"); if (m) m.onclick = () => { subsShown += 60; paint(); };
  paintStyle();
}
/* ---------- สไตล์ซับ (ชุดเดียวกับแผงใน editor · พรีวิวสดด้านบนเปลี่ยนตามทันทีที่บันทึก) ---------- */
let FONTS = [];
async function loadFonts() {
  const a = await fetch("/api/assets").then((x) => x.json()).catch(() => ({}));
  FONTS = a.sub_fonts || [];
  for (const f of FONTS) { try { const ff = new FontFace(f.name, `url(/fonts/${f.file})`, { weight: f.bold ? "700" : "400" }); await ff.load(); document.fonts.add(ff); } catch (e) { /* */ } }
  paintStyle();
}
function paintStyle() {
  const st = E && E.style; if (!st || !FONTS.length) return;
  const row = (k, label, min, max, step) => `<div class="srow"><span>${label}</span><input type="range" data-st="${k}" min="${min}" max="${max}" step="${step}" value="${st[k]}"><output>${st[k]}</output></div>`;
  $("#style").innerHTML = `<div class="fonts">${FONTS.map((f) => `<button class="${f.name === st.font ? "on" : ""}" data-font="${esc(f.name)}"><b style="font-family:'${esc(f.name)}';font-weight:${f.bold ? 700 : 400}">สวัสดี</b><span>${esc(f.name)}</span></button>`).join("")}</div>
    ${row("size", "ขนาด", 60, 220, 2)}${row("outline_w", "ขอบหนา", 0, 26, 1)}
    <div class="pchips">${[["ต่ำ", 200], ["ปกติ", 330], ["กลางจอ", 760]].map(([a, v]) => `<button class="${Math.abs(st.margin_v - v) < 40 ? "primary" : ""}" data-mv="${v}">${a}</button>`).join("")}</div>`;
  $("#style").querySelectorAll("[data-font]").forEach((b) => (b.onclick = () => saveWith((E) => (E.style.font = b.dataset.font), "เปลี่ยนฟอนต์แล้ว")));
  $("#style").querySelectorAll("[data-st]").forEach((el) => {
    el.oninput = () => (el.nextElementSibling.textContent = el.value);
    el.onchange = () => saveWith((E) => (E.style[el.dataset.st] = +el.value), "บันทึกแล้ว");
  });
  $("#style").querySelectorAll("[data-mv]").forEach((b) => (b.onclick = () => saveWith((E) => (E.style.margin_v = +b.dataset.mv), "ย้ายซับแล้ว")));
}

/* ---------- แก้ → บันทึกทั้งไฟล์ (ชนกับคอม = โหลดของล่าสุดแล้วแก้ซ้ำ) ---------- */
async function saveWith(fn, msg) {
  fn(E);
  const r = await fetch("/api/edit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ edit: E, base_rev: rev, client: "mobile", file: name }) });
  const j = await r.json();
  if (j.switched) { toast("อีกเครื่องเปิดงานอื่นอยู่ — โหลดใหม่"); return setTimeout(() => location.reload(), 1500); }
  if (j.conflict) { E = j.edit; rev = j.rev; fn(E); return saveWith(() => {}, msg); }
  if (j.ok) { rev = j.rev; toast(msg); paint(); } else toast(j.error || "บันทึกไม่ได้");
}
/* ---------- บันทึกลงรูปภาพ (iOS: แชร์ไฟล์ → "บันทึกวิดีโอ") · ต้องแตะ 2 ที: โหลดก่อน แล้วแตะแชร์ (Safari ต้องการให้แชร์ตรงจากการแตะ) ---------- */
let cur = null, saved = null;
$("#bSave").onclick = async () => {
  const b = $("#bSave");
  if (saved && saved.path === cur) {
    try { await navigator.share({ files: [saved.file] }); } catch (err) { if (err.name !== "AbortError") toast("แชร์ไม่ได้ — ใช้ปุ่มโหลดเป็นไฟล์แทน"); }
    return;
  }
  const f0 = new File([""], "x.mp4", { type: "video/mp4" });
  if (!navigator.canShare || !navigator.canShare({ files: [f0] })) { location.href = $("#aDl").href; return; }
  b.disabled = true;
  try {
    const path = cur, r = await fetch(vurl(path)), n = +r.headers.get("Content-Length") || 0, rd = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (n) b.textContent = `กำลังเตรียม ${Math.round(got / n * 100)}%`; }
    saved = { path, file: new File(parts, base(path), { type: "video/mp4" }) };
    b.textContent = "พร้อมแล้ว — แตะเพื่อบันทึก";
  } catch (err) { b.textContent = "บันทึกลงรูปภาพ"; toast("โหลดไม่สำเร็จ"); }
  b.disabled = false;
};
document.addEventListener("click", async (e) => {
  const pl = e.target.closest("[data-play]");
  if (pl) { setMode("file"); pick = pl.dataset.play; saved = null; $("#bSave").textContent = "บันทึกลงรูปภาพ"; paint(); window.scrollTo({ top: 0, behavior: "smooth" }); $("#v").play().catch(() => {}); return; }
  const d = e.target.closest("[data-del]"), s = e.target.closest("[data-swap]");
  if (d) {
    const it = E.items.find((x) => x.id === d.dataset.del); if (!it) return;
    if (it.gap) { // ตัดเข้า/หยุดภาพ = ต้องต่อคลิปกลับ (สร้างคลิปใหม่ ~ครึ่งนาที)
      d.disabled = true; d.textContent = "รอ…"; toast("กำลังต่อคลิปกลับ… รอสักครู่");
      const r = await post("/api/gap", { op: "del", id: it.gap }); toast(r.ok ? "ลบแล้ว" : r.error || "ไม่ได้"); return load();
    }
    return saveWith((E) => { E.items = E.items.filter((x) => x.id !== it.id); }, "ลบแล้ว");
  }
  if (s) {
    const it = E.items.find((x) => x.id === s.dataset.swap), cat = GIFS.lib[it.gif]?.cat;
    const ids = Object.keys(GIFS.lib).filter((k) => GIFS.lib[k].cat === cat);
    if (ids.length < 2) return toast("หมวดนี้มีตัวเดียว");
    const next = ids[(ids.indexOf(it.gif) + 1) % ids.length];
    return saveWith((E) => { const x = E.items.find((y) => y.id === it.id); if (x) x.gif = next; }, "เปลี่ยน GIF แล้ว");
  }
});
document.addEventListener("change", (e) => {
  const t = e.target.closest("[data-sub]"); if (!t) return;
  const id = t.dataset.sub, text = t.value.replace(/\n/g, " ").trim();
  saveWith((E) => { const x = E.items.find((y) => y.id === id); if (x) x.text = text; }, "แก้ซับแล้ว");
});

/* ---------- เรนเดอร์ ---------- */
async function render(preview) {
  const r = await post("/api/render", { preview });
  if (r.ok === false) return toast(r.error || "เรนเดอร์ไม่ได้");
  $("#prog").classList.add("on"); $("#bTest").disabled = $("#bRender").disabled = true;
  const t0 = Date.now();
  if (CC.push.state() === "on") toast("ออกจากหน้านี้ได้ เสร็จแล้วจะเด้งแจ้งเตือน");
  const poll = async () => {
    const s = await fetch("/api/render/status").then((x) => x.json()).catch(() => null);
    if (s) {
      const last = [...s.log].reverse().find((l) => /%|เรนเดอร์|วาด/.test(l)) || "";
      const pc = (last.match(/([\d.]+)%/) || [])[1];
      const left = pc > 3 ? (Date.now() - t0) / 1000 * (100 - pc) / pc : null;
      const eta = left == null ? "" : left < 20 ? " · อีกแป๊บเดียว" : left < 60 ? " · เหลือไม่ถึงนาที" : ` · เหลืออีก ~${Math.ceil(left / 60)} นาที`;
      $("#plog").textContent = s.state === "running" ? "กำลังเรนเดอร์ " + (pc ? Math.round(pc) + "%" + eta : "…") : s.state === "done" ? "เสร็จแล้ว" : "เรนเดอร์พัง";
      $("#pbar").style.width = (s.state === "done" ? 100 : +pc || 3) + "%";
      if (s.state !== "running" && !s.running) {
        $("#bTest").disabled = $("#bRender").disabled = false;
        setTimeout(() => $("#prog").classList.remove("on"), 1500);
        if (s.state === "done") { toast("เสร็จ — กดเล่นดูได้เลย"); pick = null; saved = null; $("#bSave").textContent = "บันทึกลงรูปภาพ"; await load(); }
        return;
      }
    }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 800);
}
/* ---------- พรีวิวสด = editor ตัวจริงแบบฝัง (?embed=1) · แก้ในหน้านี้ → editor ได้ event แล้ววาดใหม่เอง ---------- */
let mode = "live";
function setMode(m) {
  mode = m;
  $("#mLive").classList.toggle("on", m === "live"); $("#mFile").classList.toggle("on", m === "file");
  const fr = $("#live"), v = $("#v");
  fr.style.display = m === "live" ? "" : "none"; v.style.display = m === "file" ? "" : "none";
  $(".vlabel").style.display = $("#dl").style.display = m === "file" ? "" : "none";
  if (m === "live") { v.pause(); if (!fr.src) fr.src = "/edit?embed=1"; }
  else { try { fr.contentWindow.document.querySelector("#btnPlay.on")?.click(); } catch (e) { /* ยังโหลดไม่เสร็จ */ } if (!outs.length) $("#dl").style.display = "none"; }
}
$("#mLive").onclick = () => setMode("live");
$("#mFile").onclick = () => setMode("file");
$("#bTest").onclick = () => render(true);
$("#bRender").onclick = () => render(false);
function paintBell() { $("#bBell").style.color = CC.push.state() === "on" ? "var(--accent)" : ""; }
$("#bBell").onclick = async () => {
  if (CC.push.state() === "on") { if (confirm("ปิดแจ้งเตือนบนเครื่องนี้?")) await CC.push.disable(); }
  else if (await CC.push.enable()) toast("เปิดแจ้งเตือนแล้ว");
  paintBell();
};
paintBell();
load().then(() => { setMode("live"); loadFonts(); });
</script>
